# LEEWAY HEADER — DO NOT REMOVE
# REGION: LEEWAY.FORMULA.MACHINE_CONSCIOUSNESS.MC_G9.CI
# TAG: LEEWAY.FORMULA.MC_G9_PAIRED_ABLATION_SOURCE_TEST_V1
# WHAT: Test evidence matching without claiming Formula cognition improvement.
# WHO: Original LeeWay Formula owner.
# WHY: Block false causal claims and protect research provenance.
# WHERE: GitHub Actions.
