name: MC-G9 Paired Cognition Evidence
on:
  pull_request:
    paths:
      - "experiments/machine-consciousness-v0/mc-g9-paired-ablation-audit.mjs"
      - "experiments/machine-consciousness-v0/tests/mc-g9-paired-ablation-audit.test.mjs"
      - "docs/machine-consciousness/12-FORMULA-COGNITIVE-CAUSAL-PROOF-20261104.md"
      - ".github/workflows/mc-g9-paired-cognition-evidence.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check experiments/machine-consciousness-v0/mc-g9-paired-ablation-audit.mjs
      - run: node --test experiments/machine-consciousness-v0/tests/mc-g9-paired-ablation-audit.test.mjs
