name: Build README infographic asset

on:
  push:
    paths:
      - ".github/workflows/build-readme-infographic.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download LeeWay Formula Atlas
        env:
          IMAGE_URL: "https://media.canva.com/v2/document-image/hash:-1745300884/height:595/id:DAHWBWsLETo/type:B/width:335?brand=BAHWBeMXwj4&csig=AAAAAAAAAAAAAAAAAAAAAAbYVko3g8BRFxNwma7U_ZKjA-wK0DbxxtUImXIUHSsL&disableexport=T&exp=1790171659&fallback=https%3A%2F%2Fs3.amazonaws.com%2Fdocument-export.canva.com%2FsLETo%2FDAHWBWsLETo%2F1%2Fthumbnail%2F0001.png%3FX-Amz-Algorithm%3DAWS4-HMAC-SHA256%26X-Amz-Credential%3DAKIAQYCGKMUHTDF2ZFFQ%252F20260922%252Fus-east-1%252Fs3%252Faws4_request%26X-Amz-Date%3D20260922T214940Z%26X-Amz-Expires%3D60579%26X-Amz-Signature%3Dd6d80a6d7a65e065e810a885c9618b89020aef74a95b21d4400701c4ff4639ef%26X-Amz-SignedHeaders%3Dhost%26response-expires%3DWed%252C%252023%2520Sep%25202026%252014%253A39%253A19%2520GMT&osig=AAAAAAAAAAAAAAAAAAAAAHG5t_AeieW6zQ_N-CT0W_qAqpBslKT4V4iIlF1YPehQ&page=1&signed=brand%2Cdisableexport%2Cfallback%2Cpage%2Cversion&signer=document-rpc&version=1"
        run: |
          mkdir -p docs/assets
          curl -L --fail --retry 3 "$IMAGE_URL" -o docs/assets/leeway_formula_atlas.png
          test -s docs/assets/leeway_formula_atlas.png
          file docs/assets/leeway_formula_atlas.png
      - name: Commit infographic
        run: |
          git config user.name "leeway-formula-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/assets/leeway_formula_atlas.png
          if git diff --cached --quiet; then
            echo "No asset change"
            exit 0
          fi
          git commit -m "docs: add LeeWay Formula Atlas infographic [atlas-built]"
          git push
