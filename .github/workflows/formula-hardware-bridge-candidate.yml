# LEEWAY HEADER — DO NOT REMOVE
# REGION: LEEWAY.FORMULA.HARDWARE_BRIDGES.CI
# TAG: LEEWAY.FORMULA.MULTI_BRIDGE.SOURCE_CI.V1
# 5WH:
# WHAT = Retest eight hardware-aware bridge candidates against original Formula golden vectors.
# WHY = Guard immutable mathematical kernel and record actual negative/positive source results.
# WHO = Original Formula source owner; bounded outside supporting contributor, not Agent Lee.
# WHERE = .github/workflows/formula-hardware-bridge-candidate.yml.
# WHEN = 2026-11-21.
# HOW = Node source tests and golden, original output with SHA-256, retained on pass/fail.
# LICENSE = Existing Formula repository terms.
# AUTHORITY = SOURCE_CI_ONLY; NO PHYSICAL HARDWARE OR CANONICAL RECEIPT.
name: Formula Hardware Bridges V1 Source Validation
on:
  pull_request:
    paths:
      - 'runtime/canonical/leeway-formula/experimental-v2/hardware-formula-bridges.v1.mjs'
      - 'runtime/canonical/leeway-formula/experimental-v2/tests/hardware-formula-bridges.v1.test.mjs'
      - 'docs/architecture/FORMULA-HARDWARE-MULTI-BRIDGE-V1.md'
      - 'docs/evidence/pc-primary-retained-hardware-20261121.v1.json'
      - 'runtime/canonical/leeway-formula/experimental-v2/retained-hardware-qualification.v1.mjs'
      - 'runtime/canonical/leeway-formula/experimental-v2/real-cpu-representation-ab.v1.mjs'
      - 'runtime/canonical/leeway-formula/experimental-v2/tests/retained-pc-real-cpu-qualification.v1.test.mjs'
      - '.github/workflows/formula-hardware-bridge-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate-bridges:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and original immutable Formula
        run: |
          node --check runtime/canonical/leeway-formula/experimental-v2/hardware-formula-bridges.v1.mjs
          node --check runtime/canonical/leeway-formula/experimental-v2/tests/hardware-formula-bridges.v1.test.mjs
          node --check runtime/canonical/leeway-formula/experimental-v2/retained-hardware-qualification.v1.mjs
          node --check runtime/canonical/leeway-formula/experimental-v2/real-cpu-representation-ab.v1.mjs
          node --check runtime/canonical/leeway-formula/experimental-v2/tests/retained-pc-real-cpu-qualification.v1.test.mjs
          git diff --exit-code origin/main -- runtime/canonical/leeway-formula/v1
      - name: Source tests and golden v1 with raw log and source SHA
        shell: bash
        run: |
          mkdir -p .source-evidence
          set +e
          node runtime/canonical/leeway-formula/v1/tests/golden-vector-v1.mjs > .source-evidence/golden.txt 2>&1
          golden=$?
          node --test --test-reporter=tap runtime/canonical/leeway-formula/experimental-v2/tests/hardware-formula-bridges.v1.test.mjs > .source-evidence/bridge-tests.tap 2>&1
          bridge=$?
          node --test --test-reporter=tap runtime/canonical/leeway-formula/experimental-v2/tests/retained-pc-real-cpu-qualification.v1.test.mjs > .source-evidence/retained-hardware-tests.tap 2>&1
          retained=$?
          node runtime/canonical/leeway-formula/experimental-v2/real-cpu-representation-ab.v1.mjs > .source-evidence/measured-ci-cpu-ab.json 2> .source-evidence/measured-ci-cpu-ab.stderr
          physicalCpu=$?
          sha256sum .source-evidence/golden.txt .source-evidence/bridge-tests.tap .source-evidence/retained-hardware-tests.tap .source-evidence/measured-ci-cpu-ab.json .source-evidence/measured-ci-cpu-ab.stderr > .source-evidence/output.sha256
          printf '{"schema":"leeway.formula.hardware-bridges.reproducible-science.v1","commit":"%s","goldenExitCode":%d,"source11ExitCode":%d,"retainedHardwareExitCode":%d,"realCiCpuABExitCode":%d,"userPcPrimaryNewCpuExecuted":false,"ciHostCpuMeasured":true,"physicalPcieTransferMeasured":false,"productionQualified":false,"independentVeritasCertified":false}\n' "${GITHUB_SHA}" "${golden}" "${bridge}" "${retained}" "${physicalCpu}" > .source-evidence/status.json
          cat .source-evidence/golden.txt
          cat .source-evidence/bridge-tests.tap
          cat .source-evidence/retained-hardware-tests.tap
          cat .source-evidence/measured-ci-cpu-ab.json
          cat .source-evidence/measured-ci-cpu-ab.stderr
          if [ "$golden" -ne 0 ] || [ "$bridge" -ne 0 ] || [ "$retained" -ne 0 ] || [ "$physicalCpu" -ne 0 ]; then exit 1; fi
      - name: Preserve original test evidence on PASS or FAIL
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formula-hardware-bridges-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: .source-evidence/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
