name: G44 Complete 800 MiB Synthetic Macro Proof
on:
  pull_request:
    paths:
      - 'runtime/canonical/leeway-formula/experimental-v2/**'
      - '.github/workflows/g44-integrated-macro-proof.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  complete-hierarchical-math-run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify complete 800 MiB logical input through real G43 archive, G44 locality and original Formula shadow
        run: |
          node --max-old-space-size=256 runtime/canonical/leeway-formula/experimental-v2/run-g44-archived-locality-shadow.mjs > "$RUNNER_TEMP/g44-proof.json"
          node -e "
          const r=require(process.env.RUNNER_TEMP+'/g44-proof.json');
          if(r.sourceLogicalBytes!==838860800||r.sourceTileCount!==6400
             ||!r.originalArchiveReadbackPassed||!r.originalArchiveSourceDigestMatched
             ||!r.originalArchiveLocalHashChainMatched||r.independentVoxelReferencesChecked!==5
             ||r.maxAbsoluteError>1e-11||!r.originalFormulaShadowExecuted
             ||r.originalFormulaId!=='LEEWAY-FORMULA-v1.0'||r.productionAccepted!==false)
             process.exit(1);
          console.log('G44 actual archived synthetic 800 MiB 6400-tile source, locality, replay and original Formula shadow PASS');
          console.log('Elapsed ms:',r.totalArchiveLocalityReplayFormulaMs);
          console.log('Working-state digest:',r.localityWorkspaceSha256);
          console.log('Actual protected production approval: false');
          "
